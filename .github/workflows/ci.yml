name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/unbroken?sslmode=require
      BRIGHTDATA_API_TOKEN: ci-placeholder
      BRIGHTDATA_COLLECTOR_ID: c_mt33nlnkq376z132b
      FIREWORKS_API_KEY: ci-placeholder
      FIREWORKS_API_BASE_URL: https://api.fireworks.ai/inference/v1
      FIREWORKS_MODEL: accounts/fireworks/models/deepseek-v4-flash-0731
      FIREWORKS_REASONING_EFFORT: high
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check migration metadata
        run: bun run db:check

      - name: Check release hygiene
        run: bun run release:check

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test

      - name: Build production application
        run: bun run build
